spring.application.name=government-grant-disbursement-system

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/government_subsidy_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mysql123}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Beneficiary document uploads (Module 1: "beneficiary registration, document
# upload, and identity validation"). Stored on local disk under this folder;
# only the relative filename is kept in the DB.
app.upload-dir=uploads/beneficiary-documents
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# JWT (Milestone 4 security)
jwt.secret=${JWT_SECRET:82c1d4099b82d4cae6ad12fa919627dfd69f15a2ffc70f7eb88e3362cbc2cbb4}
jwt.expiration-ms=86400000